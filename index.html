
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club de Ajedrez</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="contenedor">

        <img src="iconologin.png" class="icono">
        <body background="ajedrez.jpg" class="ajedrez">

        <h1>CLUB DE AJEDREZ</h1>

        <form id="formLogin">

            <select id="rol" required>
                <option value="">Seleccione su tipo de usuario</option>
                <option value="administrador">Administrador</option>
                <option value="entrenador">Entrenador</option>
                <option value="estudiante">Estudiante</option>
            </select>

            <div class="fila">
                <label for="usuario">USUARIO</label>
                <input
                    type="text"
                    id="usuario"
                    placeholder="Ingrese su usuario"
                    required
                >
            </div>

            <div class="fila">
                <label for="contrasena">CONTRASEÑA</label>
                <input
                    type="password"
                    id="contrasena"
                    placeholder="Ingrese su contraseña"
                    required
                >
            </div>

            <button type="submit">INICIAR SESIÓN</button>

            <p id="mensaje"></p>

            <p>
                <a href="#">¿Olvidó su contraseña?</a>
            </p>

        </form>

        <h3>
            "El ajedrez se juega con la mente ¡No con las manos!"
            <br>MI (ILYA KAHN)
        </h3>

    </div>

    <script>
        const formulario = document.getElementById("formLogin");

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            const rol = document.getElementById("rol").value;
            const usuario = document.getElementById("usuario").value.trim();
            const contrasena = document.getElementById("contrasena").value;
            const mensaje = document.getElementById("mensaje");

            if (
                rol === "administrador" &&
                usuario === "admin" &&
                contrasena === "1234"
            ) {
                window.location.href = "administrador.html";
            } else {
                mensaje.textContent =
                    "Rol, usuario o contraseña incorrectos.";
            }
        });
    </script>

</body>
</html>
